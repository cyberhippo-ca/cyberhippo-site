<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-labelledby="t d">
<title id="t">What happened to 223 job applications</title>
<desc id="d">Horizontal bars. Of 223 applications from January 22 to November 10, 2026: 132 got no reply, 82 were rejected or closed, and 9 got another reply such as a viewed notice, recruiter call or questionnaire. 2 applications led to an interview.</desc>
<rect width="760" height="262" rx="12" fill="#1a0838"/>
<text x="24" y="34" fill="#f1e9ff" font-size="18" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">What happened to 223 applications</text>
<text x="24" y="56" fill="#b8a6d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Jan 22 to Nov 10, 2026. 2 of these led to an interview.</text>
<text x="168" y="105.0" fill="#f1e9ff" font-size="14" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">No reply</text>
<path d="M180,88 H638.0 Q642.0,88 642.0,92 V108 Q642.0,112 638.0,112 H180 Z" fill="#0a98a2"/>
<text x="650.0" y="105.0" fill="#f1e9ff" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">132 (59%)</text>
<text x="168" y="151.0" fill="#f1e9ff" font-size="14" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Rejected or closed</text>
<path d="M180,134 H463.0 Q467.0,134 467.0,138 V154 Q467.0,158 463.0,158 H180 Z" fill="#0a98a2"/>
<text x="475.0" y="151.0" fill="#f1e9ff" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">82 (37%)</text>
<text x="168" y="197.0" fill="#f1e9ff" font-size="14" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Other replies</text>
<path d="M180,180 H207.5 Q211.5,180 211.5,184 V200 Q211.5,204 207.5,204 H180 Z" fill="#0a98a2"/>
<text x="219.5" y="197.0" fill="#f1e9ff" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">9 (4%)</text>
<text x="24" y="246" fill="#b8a6d9" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">Source: my own application tracker, built from email (my only contact channel).</text>
